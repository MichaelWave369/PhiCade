[package]
name = "phicade-libretro"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Minimal governed libretro host for PhiCade"

[dependencies]
base64 = "0.22"
libloading = "0.8"
phicade-runtime = { path = "../phicade-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
