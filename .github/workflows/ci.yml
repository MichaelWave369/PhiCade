name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  runtime:
    name: rust / runtime + libretro tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p phicade-runtime -p phicade-libretro --all-targets

  native:
    name: tauri / cargo check + native governance/Versioned Suite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  sameboy:
    name: core / SameBoy + Replay + Phi-Bot + Driver + Autodrive + Benchmark Suites qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install core-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            git \
            curl \
            pkg-config \
            libpng-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: bash ./scripts/qualify-sameboy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phicade-qualification-receipts
          path: artifacts/*.json
          if-no-files-found: error

  scummvm:
    name: core / ScummVM 2026.3.0 launcher qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ScummVM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            pkg-config \
            python3 \
            cmake \
            nasm
      - uses: dtolnay/rust-toolchain@stable
      - run: bash ./scripts/qualify-scummvm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phicade-scummvm-qualification
          path: artifacts/scummvm-qualification.json
          if-no-files-found: error
