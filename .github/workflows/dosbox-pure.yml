name: DOSBox Pure / Rung 4-6 source-built guest input qualification
on:
  pull_request:
    paths:
      - "fixtures/dos/**"
      - "scripts/build-dos-fixture.py"
      - "scripts/qualify-dosbox-pure.sh"
      - "crates/phicade-libretro/**"
      - ".github/workflows/dosbox-pure.yml"
  push:
    branches: [main]
    paths:
      - "fixtures/dos/**"
      - "scripts/build-dos-fixture.py"
      - "scripts/qualify-dosbox-pure.sh"
      - "crates/phicade-libretro/**"
      - ".github/workflows/dosbox-pure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fixture:
    name: core / DOSBox Pure lab and production session guest qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and DOS assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm python3 git
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify lab-only input callback contract
        run: cargo test --locked -p phicade-libretro --features dos-lab-input --lib
      - name: Build pinned core and exercise original program via PhiCade
        run: bash ./scripts/qualify-dosbox-pure.sh
      - name: Verify receipts don't claim untested capability
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/dosbox-pure-original-fixture.json", encoding="utf8") as f:
              r=json.load(f)
          assert r["result"]=="PASS"
          assert r["magentaGraphicsObserved"] is True
          assert r["framesWithGreenVga"] >= 3
          assert r["framesWithCyanVga"] >= 3
          assert r["keyboardCallbackRegistered"] is True
          assert r["escapeGuestVisualTransitionObserved"] is True
          assert r["keyboardGuestDeliveryQualified"] is True
          assert r["mouseDevicePolledInCore"] is True
          assert r["mouseGuestDeliveryQualified"] is True
          assert r["coreShutdownCallbackObserved"] is True
          assert isinstance(r["frameAtCoreShutdown"], int)
          assert r["frameAtCoreShutdown"] >= 200
          assert r["guestCleanExitQualified"] is True
          assert r["retailDosGameCompatibilityQualified"] is False
          print("PASS: BIOS keyboard, guest mouse left-click, and core shutdown on guest exit; commercial games unqualified")
          PY
      - name: Verify production session API reached original DOS guest
        run: |
          python3 - <<'PY'
          import json
          with open("artifacts/dos-session-original-fixture.json", encoding="utf8") as f:
              r=json.load(f)
          assert r["schema"] == "phicade.dos-session-original-fixture.v1"
          assert r["result"] == "PASS"
          assert r["magentaFrames"] >= 3
          assert r["greenFrames"] >= 3
          assert r["cyanFrames"] >= 3
          assert r["shutdownFrame"] > 200
          for field in ("preapprovalInputRefused", "revokedInputRefused",
                        "forbiddenKeyRefused", "unboundedMouseRefused",
                        "sessionApprovalUsed", "productionKeyboardGuestObserved",
                        "productionMouseClickGuestObserved", "guestShutdownObserved"):
              assert r[field] is True, field
          assert r["retailGameCompatibilityQualified"] is False
          assert r["windowsPhysicalDeviceQualified"] is False
          print("PASS: production DOS session API end-to-end, permission denial and guest exit")
          PY
      - name: Upload only metadata evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-pure-original-fixture-evidence
          path: |
            artifacts/dosbox-pure-original-fixture.json
            artifacts/dos-session-original-fixture.json
          if-no-files-found: error
