name: Scarlett Lab / isolated inspection tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/phicade-scarlett-lab/**'
      - '.github/workflows/scarlett-lab.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/phicade-scarlett-lab/**'
      - '.github/workflows/scarlett-lab.yml'

permissions:
  contents: read

jobs:
  rust-scarlett:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run source-built fixture tests
        run: cargo test --locked -p phicade-scarlett-lab --all-targets
