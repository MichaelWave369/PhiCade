name: DOS Rung 7 / Windows focus + hardware report regression
on:
  pull_request:
    paths:
      - "apps/desktop/src/App.tsx"
      - "apps/desktop/src/DosHardwareCheck.tsx"
      - "apps/desktop/src/dosFocusGuard*"
      - "apps/desktop/src/dosHardware*"
      - "apps/desktop/src/dosInput*"
      - "src-tauri/src/lib.rs"
      - ".github/workflows/dos-hardware-windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/src/App.tsx"
      - "apps/desktop/src/DosHardwareCheck.tsx"
      - "apps/desktop/src/dosFocusGuard*"
      - "apps/desktop/src/dosHardware*"
      - "apps/desktop/src/dosInput*"
      - "src-tauri/src/lib.rs"
      - ".github/workflows/dos-hardware-windows.yml"
permissions:
  contents: read
jobs:
  focus-and-report:
    name: windows / DOS focus guard and manual evidence contract
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run DOS key mapping, focus and manual-report tests
        run: npx vitest run apps/desktop/src/dosInput.test.ts apps/desktop/src/dosFocusGuard.test.ts apps/desktop/src/dosHardwareEvidence.test.ts
      - name: Typecheck and bundle real desktop frontend
        run: npm run build --workspace @phicade/desktop
      # Tauri's Windows resource build requires icon.ico; only the source
      # PNG is tracked. Match the already-green Windows N64 CI job.
      - name: Generate Windows icons from tracked source PNG
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify DOS authority guard on Windows
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib dos_input_guard_denies_stale_revoked_and_non_human_sessions
      - name: State precise hardware evidence boundary
        run: Write-Output "PASS means Windows CI tests + frontend build passed. No USB/gamepad/keyboard physical hardware or retail game was exercised."
